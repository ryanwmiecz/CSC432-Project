<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />

  <title>Project</title>
  <link rel="stylesheet" href="/src/signup.css" />

<body>
  <header id="header"></header>

  <main id="main">
    <div class = "loginWindow">
        <h1>Sign Up</h1>
        <h2>Create a username</h2>
        <div class = "username">
            <input type = "text" class="usernameInput" placeholder = "Username" id = "usernameInfo" >
        </div>
        <h2>Create a password</h2>
        <div class = "password">
            <input type = "password" class="passwordInput" placeholder = "Password" id = "passwordInfo" >
        </div>
        <h2>Input the password again</h2>
        <div class = "password">
            <input type = "password" class="passwordInput" placeholder = "Password" id = "passwordInfoRe" >
        </div>
    <div class="warning" id="signupWarning"></div>
    <button class="signupButton" id = "signupButton">Sign Up</button>

    </div>
  </main>
    
  
  <script src="/src/users.js"></script>
  <script src="/src/signup.js"></script>
  <a href="login.html"> login</a>
  <a href="profile.html"> profile</a>
