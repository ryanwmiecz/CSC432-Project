<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project</title>
  <link rel="stylesheet" href="/src/profile.css" />
</head>

<body>
  <header id="header"></header>

  <main id="main">
    <div class = "container">
      <div class = "user">
        <img id ="userPic" alt = "wdadad">
        <div id = "userName"></div>
      </div>
      <div class = "bio">
        <div id = "bioText"></div>
      </div>
      <div class="buttonContainer">
        <input type="text" id="changeName" placeholder="Type new name">
        <button id="changeNameButton">Change Name</button>
        <input type="text" id="changeBio" placeholder="Type new bio">
        <button id="changeBioButton">Change Bio</button>
        <button class="backButton">Back</button>
        <button class="logoutButton">Log Out</button>
      </div>
    </div>
  </main>
  <a href="login.html"> login</a>
  <a href="index.html"> index</a>

  <script src="/src/users.js"></script>
  <script>
    if (window.userStore && !window.userStore.getCurrentUser()) {
      window.location.href = 'login.html';
    }

    let user = window.userStore.getCurrentUser();

    document.getElementById("userName").innerHTML = user.username;
    document.getElementById("bioText").innerHTML = user.bio;
    document.getElementById("userPic").src=user.img;

    document.addEventListener('DOMContentLoaded', function() {
        const changeNameButton = document.getElementById('changeNameButton');
        const changeNameInput = document.getElementById('changeName');
        const changeBioButton = document.getElementById('changeBioButton');
        const changeBioInput = document.getElementById('changeBio');
        const backButton = document.querySelector('.backButton');
        const logoutButton = document.querySelector('.logoutButton');

        changeNameButton.addEventListener('click', function() {
            const newName = changeNameInput.value.trim();
            if (!newName) return;

            const oldUsername = user.username;
            
            const success = window.userStore.changeUser(oldUsername, newName);

            if (success) {
                document.getElementById("userName").innerHTML = newName;
                
                user = window.userStore.getCurrentUser();
            } else {
                console.error("Failed to change username. Maybe the new name already exists.");
            }
        });
        changeBioButton.addEventListener('click', function() {
          const newBio = changeBioInput.value.trim();
          if (!newBio) return;

          window.userStore.changeBio(newBio);
          document.getElementById("bioText").innerHTML = newBio;
        });
        backButton.addEventListener('click', function() {
          window.location.href = 'index.html';
        });
        logoutButton.addEventListener('click', function() {
          window.userStore.removeCurrentUser();
          window.location.href = 'login.html';
        });
    });
  </script>

</body>

</html>
